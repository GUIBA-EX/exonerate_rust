[workspace]
members = ["crates/exonerate-core", "crates/exonerate-cli"]
resolver = "3"

[workspace.package]
edition = "2024"
rust-version = "1.87"
license = "GPL-3.0-only"
authors = ["Exonerate-RS contributors"]

[workspace.lints.rust]
unsafe_code = "forbid"

[profile.release]
lto = "thin"
codegen-units = 1
